[project]
name = "urban-heat-mvp"
version = "0.1.0"
description = "Urban Heat Mitigation & Cooling Strategies MVP"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.104.0",
    "uvicorn[standard]>=0.24.0",
    "geopandas>=0.14.0",
    # Pinned below 3.0: xgboost>=3.0 stores base_score as a JSON-list
    # string (e.g. "[3.926705E1]") instead of a plain float, which
    # crashes shap.TreeExplainer with
    # "ValueError: could not convert string to float". No fix is
    # released in shap yet as of this writing — see shap/shap#4288.
    "xgboost>=2.0.0,<3.0.0",
    # Pinned below 1.8: scikit-learn 1.8 removed the old _estimator_type
    # class attribute (replaced by the newer __sklearn_tags__ system).
    # xgboost 2.1.4's XGBModel._get_type() only added a fallback for
    # that newer system in a later xgboost release, so on 2.1.4 it
    # crashes model.save_model() with
    # "TypeError: `_estimator_type` undefined" once paired with
    # scikit-learn>=1.8. See dmlc/xgboost#11093.
    "scikit-learn>=1.3.0,<1.8.0",
    "shap>=0.43.0",
    "rasterio>=1.3.0",
    "xarray>=2023.10.0",
    "numpy>=1.25.0",
    "pandas>=2.1.0",
    "pyarrow>=14.0.0",
    "shapely>=2.0.0",
    "pyproj>=3.6.0",
    "pydantic>=2.5.0",
    "joblib>=1.3.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "httpx>=0.25.0",
    "jupyter>=1.0.0",
    "matplotlib>=3.8.0",
]

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["pipeline*", "models*", "api*"]
